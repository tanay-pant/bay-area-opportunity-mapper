name: Keep Streamlit Alive (Clean History)

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Overwrite Keepalive Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if the latest commit is a Keepalive commit
          LAST_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_MSG" == Keepalive* ]]; then
            # Amend the existing keepalive commit
            git commit --allow-empty --amend --no-edit
          else
            # Create a new keepalive commit on top of recent commits
            git commit --allow-empty -m "Keepalive: Reset Streamlit idle clock"
          fi
          
          # Force push to overwrite remote history
          git push --force origin HEAD:${{ github.ref }}