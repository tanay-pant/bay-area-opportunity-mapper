name: Keep Streamlit Alive (Clean History)

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Overwrite Keepalive Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Amend the absolute latest commit on the remote branch directly
          git commit --allow-empty --amend --no-edit
          
          # Force push to overwrite the remote history completely
          git push --force origin HEAD:${{ github.ref }}